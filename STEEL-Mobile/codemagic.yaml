workflows:
  ios-build:
    name: iOS Build (Codemagic)
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      groups:
        - pocketbase_url
      vars:
        XCODE_PROJECT: "STEEL-iOS/STEEL-iOS.xcodeproj"
        XCODE_SCHEME: "STEEL-iOS"
        BUNDLE_ID: "com.steel.ios"
      xcode:
        version: latest
      
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData
        
    working_directory: STEEL-iOS

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd STEEL-iOS
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build iOS for Simulator
        script: |
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -configuration Release \
            -allowProvisioningUpdates \
            -resultBundlePath "$CM_BUILD_DIR/ResultBundle"

      - name: Archive iOS App
        script: |
          xcodebuild clean archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/STEEL-iOS.xcarchive" \
            -allowProvisioningUpdates \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Export IPA for Ad Hoc Distribution
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/STEEL-iOS.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/STEEL-iOS/exportOptions.plist" \
            -allowProvisioningUpdates

    artifacts:
      - build/STEEL-iOS.xcarchive/**/*.ipa
      - build/ResultBundle/
      - STEEL-iOS/Pods/Manifest.lock

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

      slack:
        channel: "#builds"
        notify_on_build_start: true
        notify:
          success: true
          failure: true

      scripts:
        - name: Generate build info
          script: |
            echo "Build Number: $CM_BUILD_NUMBER"
            echo "Build URL: $CM_BUILD_URL"
            echo "App Version: 1.0.0"